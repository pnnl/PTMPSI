[project]
name = "nwbrave-med4-proteomics-agent-skills"
version = "0.1.0"
description = "Exploratory analysis of BRaVE MED4 light/dark redox proteomics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "plotly>=6.6.0",
    "polars",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
